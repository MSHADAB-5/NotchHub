<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nook Dual Clock - Analog</title>
  <style>
    :root {
      --ink: #f4f6ff;
      --muted: rgba(228, 234, 255, 0.62);
      --night-bg: #0f1320;
      --day-bg: #1d2735;
      --frame: rgba(255, 255, 255, 0.12);
      --local-accent: #9ef0cc;
      --target-accent: #ffc98d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      font-family: "Avenir Next", "SF Pro Display", "Helvetica Neue", sans-serif;
      background:
        radial-gradient(980px 540px at 14% 14%, rgba(54, 76, 100, 0.36), transparent 50%),
        radial-gradient(920px 540px at 86% 0%, rgba(125, 84, 50, 0.23), transparent 52%),
        linear-gradient(145deg, #080b12, #191522);
    }

    .panel {
      width: min(920px, 100%);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(13, 16, 24, 0.84);
      backdrop-filter: blur(18px);
      box-shadow: 0 22px 52px rgba(0, 0, 0, 0.44);
      padding: 18px;
    }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .head h1 {
      margin: 0;
      font-size: clamp(18px, 2vw, 22px);
      font-weight: 650;
      letter-spacing: 0.01em;
    }

    .head p {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    .picker {
      min-width: 196px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 12px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.04);
      outline: none;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .city-card {
      border: 1px solid var(--frame);
      border-radius: 18px;
      padding: 12px;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
    }

    .city-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 8px;
    }

    .city-name {
      margin: 0;
      font-size: 15px;
      font-weight: 620;
    }

    .zone {
      margin: 2px 0 0;
      font-size: 11px;
      color: var(--muted);
    }

    .tag {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .dial {
      width: min(180px, 72%);
      aspect-ratio: 1 / 1;
      margin: 8px auto 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      position: relative;
      background:
        radial-gradient(circle at 50% 48%, rgba(255, 255, 255, 0.05), transparent 56%),
        repeating-conic-gradient(
          from -90deg,
          rgba(255, 255, 255, 0.24) 0deg 1deg,
          rgba(255, 255, 255, 0.05) 1deg 6deg
        ),
        var(--night-bg);
      box-shadow: inset 0 0 26px rgba(0, 0, 0, 0.3);
    }

    .dial::before {
      content: "";
      position: absolute;
      inset: 14%;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hand {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: 0% 50%;
      border-radius: 999px;
      transform: translate(-2px, -50%) rotate(0deg);
    }

    .h {
      width: 26%;
      height: 4px;
      background: rgba(255, 255, 255, 0.92);
    }

    .m {
      width: 36%;
      height: 3px;
      background: rgba(255, 255, 255, 0.72);
    }

    .s {
      width: 40%;
      height: 2px;
      background: #ff934a;
    }

    .center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 8px;
      margin: -4px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.34);
    }

    .digital {
      margin: 0;
      text-align: center;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: clamp(16px, 2.5vw, 22px);
      letter-spacing: -0.02em;
      font-weight: 620;
    }

    .date {
      margin: 4px 0 0;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    .local .digital { color: var(--local-accent); }
    .target .digital { color: var(--target-accent); }

    @media (max-width: 780px) {
      .grid { grid-template-columns: 1fr; }
      .dial { width: min(190px, 62%); }
    }
  </style>
</head>
<body>
  <main class="panel">
    <section class="head">
      <div>
        <h1>Preview C — Analog Duo</h1>
        <p>Apple-like twin dials with digital fallback under each clock.</p>
      </div>
      <select class="picker" id="targetSelect">
        <option value="Europe/Paris" selected>CET — Paris</option>
        <option value="Europe/Berlin">CET — Berlin</option>
        <option value="Europe/Madrid">CET — Madrid</option>
        <option value="Europe/Rome">CET — Rome</option>
        <option value="UTC">UTC</option>
        <option value="America/New_York">New York</option>
        <option value="Asia/Dubai">Dubai</option>
      </select>
    </section>

    <section class="grid">
      <article class="city-card local">
        <div class="city-top">
          <div>
            <p class="city-name">Local Time</p>
            <p class="zone" id="localZone">--</p>
          </div>
          <span class="tag">LOCAL</span>
        </div>
        <div class="dial" id="localDial">
          <div class="hand h" id="localHour"></div>
          <div class="hand m" id="localMinute"></div>
          <div class="hand s" id="localSecond"></div>
          <div class="center"></div>
        </div>
        <p class="digital" id="localDigital">--:--:--</p>
        <p class="date" id="localDate">---</p>
      </article>

      <article class="city-card target">
        <div class="city-top">
          <div>
            <p class="city-name">Reference Zone</p>
            <p class="zone" id="targetZone">Europe/Paris</p>
          </div>
          <span class="tag">CET*</span>
        </div>
        <div class="dial" id="targetDial">
          <div class="hand h" id="targetHour"></div>
          <div class="hand m" id="targetMinute"></div>
          <div class="hand s" id="targetSecond"></div>
          <div class="center"></div>
        </div>
        <p class="digital" id="targetDigital">--:--:--</p>
        <p class="date" id="targetDate">---</p>
      </article>
    </section>
  </main>

  <script>
    const localZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const targetSelect = document.getElementById("targetSelect");
    document.getElementById("localZone").textContent = localZone;

    function dateParts(date, timeZone) {
      const str = new Intl.DateTimeFormat("en-GB", {
        timeZone,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(date);
      const [h, m, s] = str.split(":").map(Number);
      const dateLabel = new Intl.DateTimeFormat("en-US", {
        timeZone,
        weekday: "short",
        month: "short",
        day: "numeric"
      }).format(date);
      return { h, m, s, digital: str, dateLabel };
    }

    function draw(prefix, parts) {
      const hourDeg = ((parts.h % 12) + parts.m / 60 + parts.s / 3600) * 30;
      const minuteDeg = (parts.m + parts.s / 60) * 6;
      const secondDeg = parts.s * 6;

      document.getElementById(prefix + "Hour").style.transform =
        `translate(-2px, -50%) rotate(${hourDeg - 90}deg)`;
      document.getElementById(prefix + "Minute").style.transform =
        `translate(-2px, -50%) rotate(${minuteDeg - 90}deg)`;
      document.getElementById(prefix + "Second").style.transform =
        `translate(-2px, -50%) rotate(${secondDeg - 90}deg)`;

      document.getElementById(prefix + "Digital").textContent = parts.digital;
      document.getElementById(prefix + "Date").textContent = parts.dateLabel;

      const mode = parts.h >= 7 && parts.h < 20 ? "day" : "night";
      const dial = document.getElementById(prefix + "Dial");
      dial.style.background = mode === "day"
        ? "radial-gradient(circle at 50% 48%, rgba(255,255,255,0.05), transparent 56%), repeating-conic-gradient(from -90deg, rgba(255,255,255,0.24) 0deg 1deg, rgba(255,255,255,0.05) 1deg 6deg), var(--day-bg)"
        : "radial-gradient(circle at 50% 48%, rgba(255,255,255,0.05), transparent 56%), repeating-conic-gradient(from -90deg, rgba(255,255,255,0.24) 0deg 1deg, rgba(255,255,255,0.05) 1deg 6deg), var(--night-bg)";
    }

    function tick() {
      const now = new Date();
      const targetZone = targetSelect.value;
      document.getElementById("targetZone").textContent = targetZone;

      draw("local", dateParts(now, localZone));
      draw("target", dateParts(now, targetZone));
    }

    targetSelect.addEventListener("change", tick);
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Tray Premium</title>
  <style>
    :root {
      --bg: #0a0d12;
      --panel: rgba(5, 7, 11, 0.96);
      --line: rgba(255,255,255,0.08);
      --text: #f4f6ff;
      --muted: rgba(225,232,255,0.56);
      --card: rgba(255,255,255,0.05);
      --accent: #8ce0ff;
      --warm: #ffc48d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Avenir Next", "SF Pro Display", sans-serif;
      color: var(--text);
      background: linear-gradient(145deg, #0b0f16, #15131d);
    }
    .shell {
      width: 620px;
      border-radius: 0 0 34px 34px;
      background: var(--panel);
      border: 1px solid rgba(0,0,0,0.35);
      box-shadow: 0 24px 56px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px 10px;
      border-bottom: 1px solid var(--line);
    }
    .tabs, .actions { display: flex; gap: 8px; }
    .pill {
      height: 28px;
      padding: 0 12px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      font-size: 12px;
    }
    .pill.active { background: rgba(255,255,255,0.12); color: var(--text); }
    .body { padding: 14px 16px 16px; }
    .hero {
      display: grid;
      grid-template-columns: 58px 1fr auto;
      gap: 14px;
      padding: 12px;
      border-radius: 16px;
      background: linear-gradient(160deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
      border: 1px solid var(--line);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .art {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      background:
        radial-gradient(circle at 30% 25%, rgba(255,255,255,0.32), transparent 24%),
        linear-gradient(145deg, #5f2edb, #ff7148 55%, #ffcf8a);
    }
    .meta h2 { margin: 0; font-size: 15px; }
    .meta p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
    .chips { display: flex; gap: 6px; margin-top: 8px; }
    .chip {
      padding: 4px 8px;
      font-size: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      color: rgba(240,244,255,0.72);
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
    }
    .btn {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 13px;
      color: rgba(255,255,255,0.86);
    }
    .btn.play { background: rgba(255,255,255,0.14); }
    .progress {
      margin-top: 10px;
      height: 5px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      position: relative;
    }
    .progress::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 62%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--warm));
    }
    .time {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
      font-size: 11px;
      color: rgba(240,244,255,0.38);
      font-family: ui-monospace, Menlo, monospace;
    }
    .bottom {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .mini {
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--card);
      padding: 10px;
      min-height: 66px;
    }
    .mini .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .mini .value { margin-top: 8px; font-family: ui-monospace, Menlo, monospace; font-size: 18px; }
  </style>
</head>
<body>
  <main class="shell">
    <section class="topbar">
      <div class="tabs">
        <span class="pill active">Nook</span>
        <span class="pill">Tray</span>
        <span class="pill">Timer</span>
      </div>
      <div class="actions">
        <span class="pill">Pin</span>
        <span class="pill">Settings</span>
      </div>
    </section>
    <section class="body">
      <div class="hero">
        <div class="art"></div>
        <div class="meta">
          <h2>Midnight City</h2>
          <p>M83 · Hurry Up, We're Dreaming</p>
          <div class="chips">
            <span class="chip">Music</span>
            <span class="chip">Lossless</span>
            <span class="chip">MacBook Speakers</span>
          </div>
        </div>
        <div class="controls">
          <span class="btn">◀</span>
          <span class="btn play">❚❚</span>
          <span class="btn">▶</span>
        </div>
      </div>
      <div class="progress"></div>
      <div class="time"><span>1:42</span><span>-1:03</span></div>
      <div class="bottom">
        <div class="mini"><div class="label">Audio</div><div class="value">72%</div></div>
        <div class="mini"><div class="label">Brightness</div><div class="value">48%</div></div>
        <div class="mini"><div class="label">Reference</div><div class="value">20:41</div></div>
      </div>
    </section>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nook Dual Clock - Minimal Digital</title>
  <style>
    :root {
      --bg-0: #0b0c10;
      --bg-1: #171924;
      --surface: rgba(14, 16, 22, 0.86);
      --surface-line: rgba(255, 255, 255, 0.1);
      --text: #f4f6ff;
      --muted: rgba(220, 229, 255, 0.62);
      --local: #9ce9c2;
      --target: #ffca8b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      font-family: "Avenir Next", "SF Pro Display", "Helvetica Neue", sans-serif;
      background:
        radial-gradient(900px 540px at 10% 10%, rgba(79, 112, 108, 0.28), transparent 50%),
        radial-gradient(900px 560px at 90% 0%, rgba(139, 91, 67, 0.22), transparent 50%),
        linear-gradient(145deg, var(--bg-0), var(--bg-1));
    }

    .wrap {
      width: min(920px, 100%);
      background: var(--surface);
      border: 1px solid var(--surface-line);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.42);
      padding: 18px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .title {
      margin: 0;
      font-size: clamp(18px, 2vw, 22px);
      font-weight: 650;
      letter-spacing: 0.01em;
    }

    .sub {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    .picker {
      min-width: 196px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 12px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
      outline: none;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 16px;
      padding: 12px 13px;
      background: linear-gradient(155deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
    }

    .meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--muted);
    }

    .zone {
      font-size: 11px;
      color: var(--muted);
    }

    .time {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      margin: 0;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      line-height: 1;
    }

    .hm {
      font-size: clamp(34px, 7vw, 56px);
      letter-spacing: -0.04em;
      font-weight: 630;
    }

    .sec {
      font-size: clamp(14px, 2.2vw, 22px);
      color: var(--muted);
      padding-bottom: 4px;
    }

    .date {
      margin: 8px 0 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .stats {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
    }

    .stats strong {
      font-weight: 620;
      color: var(--text);
    }

    .accent-local .hm { color: var(--local); }
    .accent-target .hm { color: var(--target); }

    @media (max-width: 780px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="top">
      <div>
        <h1 class="title">Preview B — Minimal Digital</h1>
        <p class="sub">Dense, glanceable layout optimized for Nook space.</p>
      </div>
      <select class="picker" id="targetSelect">
        <option value="Europe/Paris" selected>CET — Paris</option>
        <option value="Europe/Berlin">CET — Berlin</option>
        <option value="Europe/Madrid">CET — Madrid</option>
        <option value="Europe/Rome">CET — Rome</option>
        <option value="UTC">UTC</option>
        <option value="America/New_York">New York</option>
        <option value="Asia/Dubai">Dubai</option>
      </select>
    </section>

    <section class="grid">
      <article class="card accent-local">
        <div class="meta">
          <span class="label">Local</span>
          <span class="zone" id="localZone">--</span>
        </div>
        <p class="time"><span class="hm" id="localHm">--:--</span><span class="sec" id="localSec">--</span></p>
        <p class="date" id="localDate">---</p>
        <div class="stats">
          <span>UTC <strong id="localUtc">--</strong></span>
          <span>vs CET <strong id="localDeltaCET">--</strong></span>
        </div>
      </article>

      <article class="card accent-target">
        <div class="meta">
          <span class="label">Reference</span>
          <span class="zone" id="targetZone">Europe/Paris</span>
        </div>
        <p class="time"><span class="hm" id="targetHm">--:--</span><span class="sec" id="targetSec">--</span></p>
        <p class="date" id="targetDate">---</p>
        <div class="stats">
          <span>UTC <strong id="targetUtc">--</strong></span>
          <span>vs Local <strong id="targetDeltaLocal">--</strong></span>
        </div>
      </article>
    </section>
  </main>

  <script>
    const localZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const targetSelect = document.getElementById("targetSelect");

    const localZoneEl = document.getElementById("localZone");
    const localHmEl = document.getElementById("localHm");
    const localSecEl = document.getElementById("localSec");
    const localDateEl = document.getElementById("localDate");
    const localUtcEl = document.getElementById("localUtc");
    const localDeltaCETEl = document.getElementById("localDeltaCET");

    const targetZoneEl = document.getElementById("targetZone");
    const targetHmEl = document.getElementById("targetHm");
    const targetSecEl = document.getElementById("targetSec");
    const targetDateEl = document.getElementById("targetDate");
    const targetUtcEl = document.getElementById("targetUtc");
    const targetDeltaLocalEl = document.getElementById("targetDeltaLocal");

    localZoneEl.textContent = localZone;

    function formatParts(date, timeZone) {
      const fmt = new Intl.DateTimeFormat("en-GB", {
        timeZone,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });
      const out = fmt.format(date).split(":");
      const dateLabel = new Intl.DateTimeFormat("en-US", {
        timeZone,
        weekday: "short",
        month: "short",
        day: "numeric"
      }).format(date);
      return { hm: `${out[0]}:${out[1]}`, sec: out[2], dateLabel };
    }

    function offsetFor(timeZone, atDate) {
      const localInZone = new Date(atDate.toLocaleString("en-US", { timeZone }));
      const utcInZone = new Date(atDate.toLocaleString("en-US", { timeZone: "UTC" }));
      return Math.round((localInZone - utcInZone) / 60000);
    }

    function asUtc(minutes) {
      const sign = minutes >= 0 ? "+" : "-";
      const abs = Math.abs(minutes);
      const h = String(Math.floor(abs / 60)).padStart(2, "0");
      const m = String(abs % 60).padStart(2, "0");
      return `${sign}${h}:${m}`;
    }

    function asDelta(minutes) {
      if (minutes === 0) return "same";
      const sign = minutes > 0 ? "ahead" : "behind";
      const abs = Math.abs(minutes);
      const h = Math.floor(abs / 60);
      const m = abs % 60;
      return m === 0 ? `${h}h ${sign}` : `${h}h ${m}m ${sign}`;
    }

    function tick() {
      const now = new Date();
      const targetZone = targetSelect.value;
      targetZoneEl.textContent = targetZone;

      const local = formatParts(now, localZone);
      const target = formatParts(now, targetZone);

      localHmEl.textContent = local.hm;
      localSecEl.textContent = local.sec;
      localDateEl.textContent = local.dateLabel;

      targetHmEl.textContent = target.hm;
      targetSecEl.textContent = target.sec;
      targetDateEl.textContent = target.dateLabel;

      const localOffset = offsetFor(localZone, now);
      const targetOffset = offsetFor(targetZone, now);
      const cetOffset = offsetFor("Europe/Paris", now);

      localUtcEl.textContent = asUtc(localOffset);
      targetUtcEl.textContent = asUtc(targetOffset);
      localDeltaCETEl.textContent = asDelta(cetOffset - localOffset);
      targetDeltaLocalEl.textContent = asDelta(targetOffset - localOffset);
    }

    targetSelect.addEventListener("change", tick);
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
